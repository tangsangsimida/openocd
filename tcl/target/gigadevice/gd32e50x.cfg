# Script for GigaDevice GD32E50x Cortex-M33 Series.
#
# https://www.gigadevice.com/microcontroller/gd32e503cet6/

source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME gd32e50x
}

# Every GD32E50x has at least 80 KiB SRAM.  The work area is used for flash
# programming and can be overridden by a board configuration.
if { [info exists WORKAREASIZE] } {
	set _WORKAREASIZE $WORKAREASIZE
} else {
	set _WORKAREASIZE 0xc800
}

# Allow overriding the flash-bank size; otherwise the gd32e50x driver probes it.
if { [info exists FLASH_SIZE] } {
	set _FLASH_SIZE $FLASH_SIZE
} else {
	set _FLASH_SIZE 0
}

if { [info exists CPUTAPID] } {
	set _CPUTAPID $CPUTAPID
} elseif { [using_jtag] } {
	# GD32E50x User Manual, section 12.2.3.
	set _CPUTAPID 0x790007a3
} else {
	# SW-DP IDCODE.
	set _CPUTAPID 0x0be12477
}

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -tap $_CHIPNAME.cpu

if { [using_jtag] } {
	jtag newtap $_CHIPNAME bs -irlen 5
	jtag_ntrst_delay 100
}

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME gd32e50x 0x08000000 $_FLASH_SIZE 0 0 $_TARGETNAME

adapter speed 1000
reset_config srst_nogate

if { ![using_hla] } {
	cortex_m reset_config sysresetreq
}

$_TARGETNAME configure -event examine-end {
	# Stop watchdog counters during halt:
	# DBG_CTL |= WWDGT_HOLD | FWDGT_HOLD | STB_HOLD | DSLP_HOLD | SLP_HOLD
	mmw 0xE0044004 0x00000307 0
}
